name: Reproducibility

# Builds the WebAssembly twice from clean (same path, then another path) and reports what
# differs: object files, wasm sections, strings. Run by hand while working on reproducibility.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diff:
    name: Two clean builds, compared
    runs-on: ubuntu-latest
    container: swift:6.4.2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Tools
        run: apt-get update -qq && apt-get install -y -qq wabt binutils > /dev/null
      - name: Install the Swift SDK for WebAssembly
        run: |
          for attempt in 1 2 3; do
            swift sdk install \
              https://download.swift.org/swift-6.4.2-release/wasm-sdk/swift-6.4.2-RELEASE/swift-6.4.2-RELEASE_wasm.artifactbundle.tar.gz \
              --checksum 83baca83553f8c443cda7b84800912e6e709c3acd2e7ebf277794ca5836c0da5 && break
            [ "$attempt" = 3 ] && exit 1
            sleep 10
          done
      - name: Build A, B (same path, clean) and C (another path)
        run: |
          git config --global --add safe.directory "$PWD"
          scripts/build-wasm.sh /tmp/a.wasm && cp -r .build /tmp/build-a && rm -rf .build
          scripts/build-wasm.sh /tmp/b.wasm && cp -r .build /tmp/build-b
          mkdir -p /tmp/elsewhere && git archive HEAD | tar -x -C /tmp/elsewhere
          (cd /tmp/elsewhere && scripts/build-wasm.sh /tmp/c.wasm)
          sha256sum /tmp/a.wasm /tmp/b.wasm /tmp/c.wasm
      - name: Which object files differ between A and B
        run: |
          cd /tmp/build-a && find . -name '*.o' -o -name '*.swiftmodule' | sort | while read -r f; do
            cmp -s "$f" "/tmp/build-b/$f" || echo "differs: $f"
          done | head -40
      - name: Which wasm sections differ (A vs B, A vs C)
        run: |
          for x in a b c; do wasm-objdump -h /tmp/$x.wasm | sed 's/start=0x[0-9a-f]* end=0x[0-9a-f]*//' > /tmp/$x.h; done
          echo "--- A vs B headers"; diff /tmp/a.h /tmp/b.h || true
          echo "--- A vs C headers"; diff /tmp/a.h /tmp/c.h || true
          for x in a b; do
            for s in Code Data Custom; do wasm-objdump -j "$s" -s /tmp/$x.wasm 2>/dev/null | sha256sum | sed "s|-|$x $s|"; done
          done
          echo "--- first differing bytes A vs B"; cmp -l /tmp/a.wasm /tmp/b.wasm | head -20 || true
          echo "count: $(cmp -l /tmp/a.wasm /tmp/b.wasm | wc -l)"
      - name: Strings that differ (paths, build ids, random names)
        run: |
          for x in a b c; do strings -n 8 /tmp/$x.wasm | sort -u > /tmp/$x.s; done
          echo "--- A vs B"; diff /tmp/a.s /tmp/b.s | head -40 || true
          echo "--- A vs C"; diff /tmp/a.s /tmp/c.s | head -40 || true
          echo "--- path-like strings in A"; grep -E '^/|/__w/|/tmp/|\.swift' /tmp/a.s | head -20 || true
