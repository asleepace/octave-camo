name: Reproducibility

# Builds the WebAssembly on two separate runners (same path) and at another path, then reports
# what differs: wasm sections, data, disassembly. Run by hand while working on reproducibility.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.runner }}
    strategy:
      matrix:
        runner: [one, two]
    runs-on: ubuntu-latest
    container: swift:6.4.2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install the Swift SDK for WebAssembly
        run: |
          for attempt in 1 2 3; do
            swift sdk install \
              https://download.swift.org/swift-6.4.2-release/wasm-sdk/swift-6.4.2-RELEASE/swift-6.4.2-RELEASE_wasm.artifactbundle.tar.gz \
              --checksum 83baca83553f8c443cda7b84800912e6e709c3acd2e7ebf277794ca5836c0da5 && break
            [ "$attempt" = 3 ] && exit 1
            sleep 10
          done
      - name: Build (and, on runner one, again at another path)
        run: |
          git config --global --add safe.directory "$PWD"
          nproc; uname -a; swift --version 2>&1 | head -2
          mkdir -p out
          WASM_LINK_MAP="$PWD/out/${{ matrix.runner }}.map" scripts/build-wasm.sh "out/${{ matrix.runner }}.wasm"
          if [ "${{ matrix.runner }}" = one ]; then
            mkdir -p /tmp/elsewhere && git archive HEAD | tar -x -C /tmp/elsewhere
            (cd /tmp/elsewhere && scripts/build-wasm.sh /tmp/other.wasm) && cp /tmp/other.wasm out/other.wasm
          fi
          sha256sum out/*.wasm
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wasm-${{ matrix.runner }}
          path: out/

  compare:
    name: What differs
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: w
          merge-multiple: true
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq wabt > /dev/null
      - name: Compare
        run: |
          cd w && sha256sum *.wasm
          report() {
            a=$1; b=$2
            echo "=================== $a vs $b"
            if cmp -s "$a" "$b"; then echo identical; return; fi
            echo "differing bytes: $(cmp -l "$a" "$b" | wc -l) of $(stat -c %s "$a")"
            echo "--- section headers"
            diff <(wasm-objdump -h "$a" | tail -n +3) <(wasm-objdump -h "$b" | tail -n +3) | head -20
            echo "--- details (imports, exports, globals, data segments, names)"
            diff <(wasm-objdump -x "$a" | tail -n +3) <(wasm-objdump -x "$b" | tail -n +3) | head -60
            echo "--- functions whose code differs"
            wasm-objdump -d "$a" | tail -n +3 > a.d; wasm-objdump -d "$b" | tail -n +3 > b.d
            diff a.d b.d | head -80
            echo "--- data section bytes that differ (offset a b)"
            cmp -l "$a" "$b" | head -30
          }
          report one.wasm two.wasm
          report one.wasm other.wasm
          echo "=================== who owns the differing data (linker map around the first differing address)"
          addr=$(diff <(wasm-objdump -x one.wasm) <(wasm-objdump -x two.wasm) | grep -m1 -oE '^< +- [0-9a-f]+' | grep -oE '[0-9a-f]+$')
          echo "first differing address: 0x$addr"
          python3 - "$addr" one.map <<'PY'
          import re, sys
          target = int(sys.argv[1], 16)
          rows = []
          for line in open(sys.argv[2], errors="replace"):
              m = re.match(r"\s*([0-9a-fA-F]+)\s+([0-9a-fA-F]+)\s+([0-9a-fA-F]+)\s+(.*)", line)
              if m:
                  rows.append((int(m.group(1), 16), int(m.group(3), 16), m.group(4).strip()))
          near = [r for r in rows if r[0] <= target < r[0] + max(r[1], 1)]
          for addr, size, name in near[-8:]:
              print(f"{addr:#x} size {size:#x}: {name}")
          if not near:
              print("no map entry covers it; map head:")
              print(open(sys.argv[2], errors="replace").read()[:3000])
          PY
          head -40 one.map
