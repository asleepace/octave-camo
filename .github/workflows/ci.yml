name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-macos:
    name: Swift (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - name: Build
        run: swift build -c release
      - name: Test
        run: swift test -c release

  swift-linux:
    name: Swift (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - name: Build
        run: swift build -c release
      - name: Test
        run: swift test -c release

  wasm:
    name: Swift (WebAssembly)
    runs-on: ubuntu-latest
    container: swift:6.4.2
    steps:
      - uses: actions/checkout@v4
      - name: Install the Swift SDK for WebAssembly
        run: >
          swift sdk install
          https://download.swift.org/swift-6.4.2-release/wasm-sdk/swift-6.4.2-RELEASE/swift-6.4.2-RELEASE_wasm.artifactbundle.tar.gz
          --checksum 83baca83553f8c443cda7b84800912e6e709c3acd2e7ebf277794ca5836c0da5
      - name: Build
        run: scripts/build-wasm.sh web/public/octave-camo.wasm
      - name: Build (debug, for tests: its traps print a reason)
        run: CONFIG=debug scripts/build-wasm.sh wasm-debug/octave-camo-debug.wasm
      - uses: actions/upload-artifact@v4
        with:
          name: octave-camo-wasm
          path: web/public/octave-camo.wasm
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: octave-camo-wasm-debug
          path: wasm-debug/octave-camo-debug.wasm
          if-no-files-found: error

  web:
    name: Web app
    needs: wasm
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: octave-camo-wasm
          path: web/public
      - uses: actions/download-artifact@v4
        with:
          name: octave-camo-wasm-debug
          path: web/test/wasm
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Test (runs the real wasm build)
        run: bun test --timeout 600000
      - name: Build
        run: bunx vite build
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: web
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  harness:
    name: Harness (Bun)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: harness
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System and Python dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
          pip install numpy scipy
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Test
        run: bun test
