name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # A newer push supersedes a branch's run, but never cuts off a deploy (and its live-site check).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least privilege: jobs only read the repository unless they say otherwise (deploy).
permissions:
  contents: read

jobs:
  swift-macos:
    name: Swift (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: swift --version
      - name: Build
        run: swift build -c release
      - name: Test
        run: swift test -c release

  swift-linux:
    name: Swift (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: swift --version
      - name: Build
        run: swift build -c release
      - name: Test
        run: swift test -c release
      - name: Build the CLI with a static Swift runtime (for the benchmark gate)
        run: swift build -c release --static-swift-stdlib --product octave-camo
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: octave-camo-cli-linux
          path: .build/release/octave-camo
          if-no-files-found: error

  wasm:
    name: Swift (WebAssembly)
    runs-on: ubuntu-latest
    container: swift:6.4.2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install the Swift SDK for WebAssembly
        run: >
          swift sdk install
          https://download.swift.org/swift-6.4.2-release/wasm-sdk/swift-6.4.2-RELEASE/swift-6.4.2-RELEASE_wasm.artifactbundle.tar.gz
          --checksum 83baca83553f8c443cda7b84800912e6e709c3acd2e7ebf277794ca5836c0da5
      - name: Build
        run: scripts/build-wasm.sh web/public/octave-camo.wasm
      - name: Build debug variant (its traps print a reason)
        run: CONFIG=debug scripts/build-wasm.sh wasm-debug/octave-camo-debug.wasm
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: octave-camo-wasm
          path: web/public/octave-camo.wasm
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: octave-camo-wasm-debug
          path: wasm-debug/octave-camo-debug.wasm
          if-no-files-found: error

  web:
    name: Web app
    needs: wasm
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: octave-camo-wasm
          path: web/public
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: octave-camo-wasm-debug
          path: web/test/wasm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Test (runs the real wasm build)
        run: bun test test/ --timeout 600000
      - name: Build
        run: bunx vite build
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: web/dist
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site-checksums
          path: web/dist/checksums.txt
          if-no-files-found: error

  e2e:
    name: Web end-to-end (Chromium, real wasm)
    needs: wasm
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: octave-camo-wasm
          path: web/public
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: bun install --frozen-lockfile
      - name: Chromium, and Google Chrome (H.264/AAC, for the phone-style MOV case)
        run: bunx playwright install --with-deps chromium chrome
      - name: Build (exactly as deployed, with the Content-Security-Policy)
        run: bunx vite build
      - name: Test
        run: |
          bunx vite preview --port 4173 --strictPort &
          for i in $(seq 1 30); do curl -sf http://localhost:4173/octave-camo/ >/dev/null && break; sleep 1; done
          E2E_URL=http://localhost:4173/octave-camo/ E2E_CHROME=1 bun test e2e/ --timeout 900000

  bench:
    name: Benchmark gate (both attackers, 6 clips, harness and Swift)
    needs: swift-linux
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: harness
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: octave-camo-cli-linux
          path: .build/release
      - name: The shipped Swift pipeline, as a CLI
        working-directory: .
        run: chmod +x .build/release/octave-camo && .build/release/octave-camo --help | head -3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: System and Python dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
          pip install numpy scipy
      - run: bun install --frozen-lockfile
      - name: The default chain (harness and Swift) must not leak; uncloaked clips must
        run: bun run bench:gate
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bench-results
          path: harness/bench-results.json
          if-no-files-found: ignore

  deploy:
    name: Deploy to GitHub Pages
    # Only a build that passed everything ships.
    needs: [swift-macos, swift-linux, wasm, web, e2e, harness, bench]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: site-checksums
      - name: The live site serves exactly what CI built
        env:
          SITE: ${{ steps.deployment.outputs.page_url }}
        run: |
          # A query string per commit gets past the CDN's cache of the previous deploy.
          fetch() { curl -sf --retry 5 --retry-delay 10 "${SITE}$1?v=${GITHUB_SHA}"; }
          fetch checksums.txt | diff - checksums.txt
          while read -r hash file; do
            actual=$(fetch "$file" | sha256sum | cut -d' ' -f1)
            [ "$actual" = "$hash" ] || { echo "mismatch: $file"; exit 1; }
          done < checksums.txt
          echo "all $(wc -l < checksums.txt) files match"

  harness:
    name: Harness (Bun)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: harness
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: System and Python dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
          pip install numpy scipy
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Test
        run: bun test
